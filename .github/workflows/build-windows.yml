name: Build Windows (MinGW64)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 and MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-zlib

      - name: Fix legacy target name in CopyToBuildDir.cmake
        run: |
          sed -i 's/TARGET_FILE_DIR:scantailor/TARGET_FILE_DIR:scantailor-advanced/g' cmake/CopyToBuildDir.cmake

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=dist

      - name: Build project
        run: |
          cmake --build build --config Release

      - name: Stage files and deploy runtime dependencies
        run: |
          cmake --install build
          
          # 1. Locate and run windeployqt-qt5
          DEPLOY_QT=$(which windeployqt-qt5 windeployqt /mingw64/bin/windeployqt* 2>/dev/null | head -n 1)
          if [ -n "$DEPLOY_QT" ]; then
            "$DEPLOY_QT" dist/scantailor-advanced.exe --no-translations --compiler-runtime || true
          fi

          # 2. Ensure Qt platform and image plugins are present
          QT_PLUGINS_DIR=$(qmake-qt5 -query QT_INSTALL_PLUGINS 2>/dev/null || echo "/mingw64/share/qt5/plugins")
          if [ ! -d "$QT_PLUGINS_DIR" ]; then
            QT_PLUGINS_DIR="/mingw64/plugins"
          fi
          if [ -d "$QT_PLUGINS_DIR" ]; then
            mkdir -p dist/platforms dist/styles dist/imageformats dist/iconengines
            cp -u "$QT_PLUGINS_DIR/platforms/qwindows.dll" dist/platforms/ 2>/dev/null || true
            cp -u "$QT_PLUGINS_DIR/styles/"*.dll dist/styles/ 2>/dev/null || true
            cp -u "$QT_PLUGINS_DIR/imageformats/"*.dll dist/imageformats/ 2>/dev/null || true
            cp -u "$QT_PLUGINS_DIR/iconengines/"*.dll dist/iconengines/ 2>/dev/null || true
          fi

          # 3. Recursively harvest all DLL dependencies (C/C++ runtime, Qt, TIFF, PNG, JPEG, zlib)
          while true; do
            added=0
            for bin in dist/*.exe dist/*.dll dist/*/*.dll; do
              [ -f "$bin" ] || continue
              for dll in $(ldd "$bin" 2>/dev/null | grep -o '/mingw64/bin/[^ ]*'); do
                target="dist/$(basename "$dll")"
                if [ ! -f "$target" ]; then
                  cp -u "$dll" dist/
                  added=$((added + 1))
                fi
              done
            done
            [ $added -eq 0 ] && break
          done

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanTailor-Advanced-Windows-x64
          path: dist/
