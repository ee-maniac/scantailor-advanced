name: Build Windows (MinGW64)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 and MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-translations
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-zlib

      - name: Fix legacy target name in CopyToBuildDir.cmake
        run: |
          sed -i 's/TARGET_FILE_DIR:scantailor/TARGET_FILE_DIR:scantailor-advanced/g' cmake/CopyToBuildDir.cmake

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=dist

      - name: Build project
        run: |
          cmake --build build --config Release

      - name: Stage files and deploy runtime dependencies
        run: |
          set +e

          # 1. Run CMake installation to stage executable and translations
          cmake --install build

          # 2. Deploy Qt platform and graphic plugins
          for pdir in /mingw64/share/qt5/plugins /mingw64/plugins; do
            if [ -d "$pdir" ]; then
              mkdir -p dist/platforms dist/styles dist/imageformats dist/iconengines
              cp -f "$pdir/platforms/qwindows.dll" dist/platforms/ 2>/dev/null
              cp -f "$pdir/styles/"*.dll dist/styles/ 2>/dev/null
              cp -f "$pdir/imageformats/"*.dll dist/imageformats/ 2>/dev/null
              cp -f "$pdir/iconengines/"*.dll dist/iconengines/ 2>/dev/null
              break
            fi
          done

          # 3. Create portable qt.conf
          cat << 'EOF' > dist/qt.conf
          [Paths]
          Prefix = .
          Plugins = .
          Translations = translations
          EOF

          # 4. Multi-pass recursive discovery for all transitive DLL dependencies
          for pass in 1 2 3 4; do
            for bin in dist/*.exe dist/*.dll dist/*/*.dll; do
              [ -f "$bin" ] || continue
              for dll in $(ldd "$bin" 2>/dev/null | grep -io '/mingw64/bin/[^ ]*\.dll'); do
                target="dist/$(basename "$dll")"
                if [ -f "$dll" ] && [ ! -f "$target" ]; then
                  cp -f "$dll" dist/
                fi
              done
            done
          done

          # 5. Final sanity check: verify primary executable exists
          if [ ! -f "dist/scantailor-advanced.exe" ]; then
            echo "Error: scantailor-advanced.exe was not found in dist/" >&2
            exit 1
          fi

          exit 0

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanTailor-Advanced-Windows-x64
          path: dist/
